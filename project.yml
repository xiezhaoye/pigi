name: Pigi
options:
  bundleIdPrefix: site.xiezhaoye
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Pigi:
    type: application
    platform: macOS
    sources:
      - Pigi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: site.xiezhaoye.pigi
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: pigi
        PRODUCT_MODULE_NAME: Pigi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: pigi
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Pigi/Pigi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
